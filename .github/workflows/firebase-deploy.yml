name: Deploy Firebase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "firebase/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check secrets
        id: check
        run: |
          missing=""
          [ -z "$FIREBASE_SERVICE_ACCOUNT" ] && missing="$missing FIREBASE_SERVICE_ACCOUNT"
          [ -z "$FIREBASE_PROJECT_ID" ] && missing="$missing FIREBASE_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "Skipping Firebase deploy. These repository secrets are empty:$missing"
            echo "Add them in GitHub: Settings > Secrets and variables > Actions, then run this workflow again."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "Both Firebase secrets are set."
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Firebase tools
        if: steps.check.outputs.ready == 'true'
        run: npm i -g firebase-tools

      - name: Write service account file
        if: steps.check.outputs.ready == 'true'
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Deploy rules and indexes
        if: steps.check.outputs.ready == 'true'
        run: |
          cd firebase
          firebase deploy --only firestore:rules,firestore:indexes,database --project "$FIREBASE_PROJECT_ID" --non-interactive
