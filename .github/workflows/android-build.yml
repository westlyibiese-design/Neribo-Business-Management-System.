name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Using the real google-services.json from the repository secret."
          else
            cat > app/google-services.json <<'EOF_JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "nbms-placeholder",
              "storage_bucket": "nbms-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.westly.nbms" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyPlaceholder0000000000000000000000" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF_JSON
            echo "No GOOGLE_SERVICES_JSON secret set. Using a placeholder file."
          fi

      - name: Export Supabase settings
        env:
          SECRET_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SECRET_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "SUPABASE_URL=${SECRET_SUPABASE_URL:-https://placeholder.supabase.co}" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=${SECRET_SUPABASE_ANON_KEY:-placeholder-anon-key}" >> "$GITHUB_ENV"

      - name: Download fonts (Inter and Playfair Display)
        run: |
          mkdir -p app/src/main/res/font
          BASE="https://github.com/google/fonts/raw/main/ofl"
          curl -fsSL --retry 3 -o app/src/main/res/font/inter_variable.ttf \
            "$BASE/inter/Inter%5Bopsz%2Cwght%5D.ttf" \
            || { echo "Inter download failed. The app will use the system sans font."; rm -f app/src/main/res/font/inter_variable.ttf; }
          curl -fsSL --retry 3 -o app/src/main/res/font/playfair_display_variable.ttf \
            "$BASE/playfairdisplay/PlayfairDisplay%5Bwght%5D.ttf" \
            || { echo "Playfair download failed. The app will use the system serif font."; rm -f app/src/main/res/font/playfair_display_variable.ttf; }
          ls -la app/src/main/res/font || true

      - name: Set up signing key
        env:
          NBMS_KEYSTORE_BASE64: ${{ secrets.NBMS_KEYSTORE_BASE64 }}
          SECRET_NBMS_KEYSTORE_PASSWORD: ${{ secrets.NBMS_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$NBMS_KEYSTORE_BASE64" ] && [ -n "$SECRET_NBMS_KEYSTORE_PASSWORD" ]; then
            printf '%s' "$NBMS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nbms-release.jks"
            echo "NBMS_KEYSTORE_PATH=$RUNNER_TEMP/nbms-release.jks" >> "$GITHUB_ENV"
            echo "NBMS_KEYSTORE_PASSWORD=$SECRET_NBMS_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "Signing with the NBMS key."
          else
            echo "No NBMS signing secrets set. Using the debug key."
          fi

      - name: Create Gradle wrapper if missing
        run: |
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nbms-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Job summary
        run: |
          APK_NAME=$(basename app/build/outputs/apk/debug/*.apk)
          echo "APK built: \`$APK_NAME\` (download artifact **nbms-debug-apk**)" >> "$GITHUB_STEP_SUMMARY"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
