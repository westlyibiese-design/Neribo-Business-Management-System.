# NBMS Supabase configuration (used by the Supabase CLI in GitHub Actions)
project_id = "nbms"

[functions.health]
verify_jwt = false

[functions.firebase-token]
verify_jwt = false

[functions.create-business]
verify_jwt = false

[functions.verify-pin]
verify_jwt = false

# Phase 6: Device Lock. These check the caller themselves (requireMember) and answer {ok:false,error} with 401.
[functions.device-list]
verify_jwt = false

[functions.device-pin-set]
verify_jwt = false

[functions.device-pin-verify]
verify_jwt = false

[functions.device-revoke]
verify_jwt = false

# Phase 24: housekeeping auto-queue. Called by the 5-minute schedule (header x-cron-key) and by "Run Queue Now".
# The function checks the caller itself, so the gateway must not demand a JWT.
[functions.housekeeping-queue-run]
verify_jwt = false
